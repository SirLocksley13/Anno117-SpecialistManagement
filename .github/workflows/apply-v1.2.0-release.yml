name: Apply Specialist Management v1.2.0 release

on:
  push:
    branches:
      - release/v1.2.0

permissions:
  contents: write

jobs:
  apply-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified release patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .release-v1.2.0/gz64.part000 \
            .release-v1.2.0/small2a \
            .release-v1.2.0/small2b \
            .release-v1.2.0/small.part003 \
            .release-v1.2.0/small.part004 \
            .release-v1.2.0/small.part005 \
            .release-v1.2.0/gz64.part003 \
            > /tmp/SpecialistManagement_v1.2.0.patch.gz.b64
          base64 --decode /tmp/SpecialistManagement_v1.2.0.patch.gz.b64 > /tmp/SpecialistManagement_v1.2.0.patch.gz
          gzip -dc /tmp/SpecialistManagement_v1.2.0.patch.gz > /tmp/SpecialistManagement_v1.2.0.patch
          echo "63d53894252ade0dc271a981cd86b0fd3de6e15dce2eb2b5a98a541c0b0ac35b  /tmp/SpecialistManagement_v1.2.0.patch" | sha256sum -c -

      - name: Apply release source
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/SpecialistManagement_v1.2.0.patch
          git apply /tmp/SpecialistManagement_v1.2.0.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release Specialist Management v1.2.0"
          git push
